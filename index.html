    * {

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fadeIn {
      animation: fadeIn 0.5s ease-out;
    }
    
    .story-card, .pricing-card, .opportunity-card {
      transition: all 0.3s ease;
    }
    
    .story-card:hover, .pricing-card:hover, .opportunity-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .page-transition {
      transition: all 0.3s ease;
    }
    
    .file-input-label:hover {
      background-color: #f3f4f6;
      border-color: #FF7A00;
    }
    
    .active-tab {
      border-bottom: 3px solid #FF7A00;
      color: #FF7A00;
      font-weight: 600;
    }
    
    .modal-overlay {
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    /* Cookie Consent Banner */
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .cookie-banner.show {
      transform: translateY(0);
    }

    /* Dropdown menu styles */
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      width: 12rem;
      background-color: white;
      border-radius: 0.75rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid #f1f5f9;
      padding: 0.5rem 0;
      z-index: 50;
    }

    .dropdown-container:hover .dropdown-menu {
      display: block;
    }

    .dropdown-menu button {
      width: 100%;
      text-align: left;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .dropdown-menu button:hover {
      background-color: #fff7ed;
      color: #FF7A00;
    }

    .dropdown-menu hr {
      margin: 0.5rem 0;
      border-color: #f1f5f9;
    }

    .dropdown-menu .sign-out:hover {
      background-color: #fef2f2;
      color: #dc2626;
    }

      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 200px;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
    }

    .opportunity-image {
      height: 200px;
      background-size: cover;
      background-position: center;
      border-radius: 1rem 1rem 0 0;
    }

    .alumni-image {
      width: 100%;
      height: 200px;
      background-size: cover;
      background-position: center;
      border-radius: 1rem 1rem 0 0;
    }

    /* Message and connection badges */

      top: -5px;
      right: -5px;

      color: white;
      border-radius: 9999px;
      width: 18px;
      height: 18px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .connection-suggestion {

    }

    // ========================
    // Cookie Consent Manager
    // ========================
    function CookieConsent({ onAccept, onDecline }) {
      const [show, setShow] = React.useState(false);

      React.useEffect(() => {
        const consent = localStorage.getItem('cookieConsent');
        if (!consent) {
          setShow(true);
        }
      }, []);

      const handleAccept = () => {
        localStorage.setItem('cookieConsent', 'accepted');
        setShow(false);
        if (onAccept) onAccept();
      };

      const handleDecline = () => {
        localStorage.setItem('cookieConsent', 'declined');
        setShow(false);
        if (onDecline) onDecline();
      };

      if (!show) return null;

      return (
        <div className="cookie-banner show">
          <div className="max-w-7xl mx-auto px-6 py-4">

                </p>

                  onClick={handleDecline}
                  className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition"

                >

                </button>
              </div>
            </div>
          </div>
        </div>
      );

    // ========================
    // Connection Suggestion Engine
    // ========================
    function getConnectionSuggestions(currentUser) {
      // Calculate similarity scores based on industries, location, role
      return mockUsers
        .map(user => ({
          ...user,
          similarityScore: calculateSimilarity(currentUser, user)
        }))
        .filter(user => user.similarityScore > 50)
        .sort((a, b) => b.similarityScore - a.similarityScore);
    }

    function calculateSimilarity(user1, user2) {
      let score = 0;
      
      // Industry overlap (40 points max)
      const commonIndustries = user1.profile.industries.filter(ind => 
        user2.industries.includes(ind)
      ).length;
      score += commonIndustries * 10;

      // Same role (20 points)
      if (user1.profile.role === user2.role) score += 20;

      // Same region/country (15 points)
      if (user1.profile.location.split(', ')[1] === user2.location.split(', ')[1]) score += 15;

      // Mutual connections (5 points each)
      score += (user2.mutualConnections || 0) * 5;

      return Math.min(score, 100);
    }

    // ========================
    // Message Composer Component
    // ========================
    function MessageComposer({ recipient, onSend, onClose }) {
      const [message, setMessage] = React.useState('');
      const { checkMessageLimit } = React.useContext(SubscriptionContext);
      const limit = checkMessageLimit();

      const handleSend = () => {
        if (!message.trim()) return;
        
        if (!limit.canSend) {
          alert(`You've reached your message limit. Upgrade to send more messages.`);
          return;
        }

        onSend(message);
        setMessage('');
      };

      return (
        <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-8 animate-fadeIn">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl font-bold text-slate-900">
                Message {recipient.name}
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div className="mb-4 p-4 bg-orange-50 rounded-xl">
              <p className="text-sm text-slate-600">
                Sending to: <span className="font-semibold">{recipient.name}</span>
              </p>
              {!limit.canSend && (
                <p className="text-xs text-red-600 mt-2">
                  ⚠️ You've reached your message limit. Upgrade to send more.
                </p>
              )}
            </div>

            <textarea
              value={message}
              onChange={(e) => setMessage(e.target.value)}
              placeholder="Write your message..."
              className="w-full h-32 p-4 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 resize-none"
              disabled={!limit.canSend}
            />

            <div className="flex justify-end gap-3 mt-6">
              <button
                onClick={onClose}
                className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition"
              >
                Cancel
              </button>
              <button
                onClick={handleSend}
                disabled={!message.trim() || !limit.canSend}
                className="px-6 py-2 bg-orange-500 text-white rounded-lg font-semibold hover:bg-orange-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
              >
                Send Message
              </button>
            </div>

            <p className="text-xs text-slate-500 mt-4 text-center">
              {limit.canSend 
                ? `${limit.remaining} messages remaining this month`
                : 'Upgrade to send more messages'}
            </p>
          </div>
        </div>
      );
    }

    // ========================
    // MAIN APP
    // ========================
    function App() {
      const [currentPage, setCurrentPage] = React.useState('home');
      const [selectedOpportunity, setSelectedOpportunity] = React.useState(null);
      const [selectedStory, setSelectedStory] = React.useState(null);

      // Subscription context value with limit checking
      const subscriptionContext = {
        user: mockUser,
        checkMessageLimit: () => {
          const limits = mockUser.subscription.limits;
          return {
            canSend: limits.messagesSent === -1 || limits.messagesSent > 0,
            canRead: limits.canReadMessages,
            remaining: limits.messagesSent === -1 ? 999 : limits.messagesSent
          };
        },
        checkConnectionLimit: () => {
          const limits = mockUser.subscription.limits;
          return {
            canAdd: limits.connections === -1 || limits.connections > 0,
            remaining: limits.connections === -1 ? 999 : limits.connections
          };
        },
        checkPitchLimit: () => {
          const limits = mockUser.subscription.limits;
          return {
            canSubmit: limits.canSubmitPitches || false,
            remaining: limits.pitches === -1 ? 999 : limits.pitches || 0
          };
        },
        hasFeature: (feature) => mockUser.subscription.features[feature] || false,
        canAccess: (requiredPlan) => {
          const planLevels = { free: 1, basic: 2, professional: 3, enterprise: 4 };
          const userLevel = planLevels[mockUser.subscription.plan];
          const requiredLevel = planLevels[requiredPlan];
          return userLevel >= requiredLevel;
        },
        loading: false
      };

      const navigate = (page, data = null) => {
        if (page === 'opportunity-detail') {
          setSelectedOpportunity(data.opportunity);
          setCurrentPage('opportunity-detail');
        } else if (page === 'alumni-story-detail') {
          setSelectedStory(data.story);
          setCurrentPage('alumni-story-detail');
        } else {
          setCurrentPage(page);
          setSelectedOpportunity(null);
          setSelectedStory(null);
        }
        window.scrollTo(0, 0);
      };

      const renderPage = () => {
        switch(currentPage) {
          case 'home': return <LandingPage onNavigate={navigate} />;
          case 'pitch': return <PitchSubmissionPage onNavigate={navigate} />;
          case 'explore': return <ExplorePage onNavigate={navigate} />;
          case 'alumni': return <AlumniPage onNavigate={navigate} />;
          case 'pricing': return <PricingPage onNavigate={navigate} />;
          case 'messages': return <MessagesPage onNavigate={navigate} />;
          case 'my-pitches': return <MyPitchesPage onNavigate={navigate} />;
          case 'profile': return <ProfilePage onNavigate={navigate} />;
          case 'connections': return <ConnectionsPage onNavigate={navigate} />;
          case 'opportunity-detail': return <OpportunityDetailPage opportunity={selectedOpportunity} onNavigate={navigate} />;
          case 'alumni-story-detail': return <AlumniStoryDetailPage story={selectedStory} onNavigate={navigate} />;
          default: return <LandingPage onNavigate={navigate} />;
        }
      };

      return (
        <SubscriptionContext.Provider value={subscriptionContext}>
          <div className="page-transition">{renderPage()}</div>
        </SubscriptionContext.Provider>
      );
    }

    // Render
    const container = document.getElementById('app');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
